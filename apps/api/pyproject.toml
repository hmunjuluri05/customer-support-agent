[project]
name = "support-agent-api"
version = "0.1.0"
description = "Customer Support AI Agent - FastAPI backend"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.120,<0.121",
    "uvicorn[standard]>=0.38,<0.39",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "alembic>=1.14,<2",
    "pgvector>=0.3.6,<1",
    "openai>=1.60,<3",
    "azure-identity>=1.19,<2",
    # azure.identity.aio requires an async transport; without it
    # DefaultAzureCredential raises ImportError at construction.
    "aiohttp>=3.11,<4",
    "tiktoken>=0.8,<1",
    "markdown-it-py>=3.0,<4",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.8,<1",
    "mypy>=1.14,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["support"]

# ------------------------------------------------------------------- tooling --

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle, pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "ASYNC",            # async pitfalls
    "RUF",
]
ignore = [
    "B008",             # FastAPI Depends() in defaults is idiomatic
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
